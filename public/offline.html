<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>No connection — AniSystem</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
            padding: 1.5rem; background: #f9fafb; color: #1f2937;
            font-family: 'Nunito Sans', ui-sans-serif, system-ui, sans-serif; }
        .card { width: min(24rem, 100%); text-align: center; background: #fff; border: 1px solid #e5e7eb;
            border-radius: 1.1rem; padding: 2rem 1.5rem; box-shadow: 0 20px 50px -30px rgb(0 0 0 / .4); }
        .mark { width: 3.5rem; height: 3.5rem; margin: 0 auto 1rem; border-radius: 999px;
            display: flex; align-items: center; justify-content: center; background: #f0f7e8; color: #4a7c2a; }
        h1 { font-size: 1.15rem; font-weight: 800; margin: 0 0 .4rem; }
        p { font-size: .88rem; line-height: 1.55; color: #6b7280; margin: 0 0 1.2rem; }
        button { border: 0; border-radius: .7rem; padding: .65rem 1.4rem; font-size: .9rem; font-weight: 800;
            background: #4a7c2a; color: #fff; cursor: pointer; }
        @media (prefers-color-scheme: dark) {
            body { background: #10160c; color: #e8efe1; }
            .card { background: #151b12; border-color: #2b3a1c; }
            .mark { background: rgb(107 159 61 / .22); color: #a5c97e; }
            p { color: #9fb08e; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark">
            <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18.4 18.4A9 9 0 015.6 5.6m3 12.8a9 9 0 0010-10M3 3l18 18"/></svg>
        </div>
        <h1>No connection</h1>
        <p>AniSystem keeps the season on the server, so it needs a signal to show you the real thing rather than an old copy of it. Try again once you have a bar or two.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
